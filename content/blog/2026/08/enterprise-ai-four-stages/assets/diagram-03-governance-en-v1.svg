<svg lang="en" data-locale="en" xmlns="http://www.w3.org/2000/svg" width="1080" height="820" viewBox="0 0 1080 820">
  <title>Human confirmation for Copilot and system guardrails for Agent</title>
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#FFFFFF" opacity="0.20"/>
      <circle cx="20" cy="18" r="0.8" fill="#29305F" opacity="0.035"/>
    </pattern>
    <clipPath id="mascotBubble"><circle cx="935" cy="715" r="89"/></clipPath>
  </defs>
  <rect width="1080" height="820" fill="#EAF6FF"/>
  <g fill="#FFF8EC">
    <circle cx="906" cy="34" r="66"/><circle cx="972" cy="30" r="94"/><circle cx="1056" cy="66" r="70"/>
  </g>
  <g fill="#BDE9DC" opacity="0.78">
    <circle cx="958" cy="77" r="36"/><circle cx="1010" cy="80" r="45"/><circle cx="1068" cy="92" r="36"/>
  </g>
  <path d="M64 58 H118" stroke="#F47F70" stroke-width="7" stroke-linecap="round"/>
  <text x="64" y="116" fill="#292A5A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="35" font-weight="700">Human Checks Become System Guardrails</text>
  <text x="64" y="157" fill="#4B527C" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18">Unattended operation does not mean ungoverned operation</text>
  <line x1="540" y1="205" x2="540" y2="670" stroke="#7E8FD5" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <text x="92" y="238" fill="#292A5A" font-size="31" font-weight="700">Copilot</text>
    <text x="92" y="273" fill="#4B527C" font-size="16">Key steps require human confirmation</text>
    <circle cx="164" cy="360" r="30" fill="#FFF8EC" stroke="#292A5A" stroke-width="3"/>
    <text x="164" y="367" text-anchor="middle" fill="#292A5A" font-size="15">Goal</text>
    <line x1="194" y1="360" x2="290" y2="360" stroke="#7E8FD5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="322" cy="360" r="34" fill="#BDE9DC" stroke="#292A5A" stroke-width="3"/>
    <text x="322" y="367" text-anchor="middle" fill="#292A5A" font-size="14">Execute</text>
    <line x1="356" y1="360" x2="438" y2="360" stroke="#7E8FD5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="466" cy="360" r="30" fill="#F47F70" stroke="#292A5A" stroke-width="3"/>
    <text x="466" y="367" text-anchor="middle" fill="#FFFFFF" font-size="13">Human</text>
    <text x="92" y="454" fill="#292A5A" font-size="18" font-weight="600">People catch risk case by case</text>
    <text x="92" y="493" fill="#4B527C" font-size="16">Review · Reject · Take over</text>
    <text x="604" y="238" fill="#292A5A" font-size="31" font-weight="700">Agent</text>
    <g data-multiline="true"><text x="604" y="261" fill="#4B527C" font-size="16">Runs autonomously within</text><text x="604" y="283" fill="#4B527C" font-size="16">agreed boundaries</text></g>
    <rect x="604" y="324" width="356" height="92" rx="28" fill="#929FE5" stroke="#292A5A" stroke-width="3"/>
    <text x="782" y="365" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600">Goal → Execute → Outcome</text>
    <text x="782" y="397" text-anchor="middle" fill="#FFF8EC" font-size="15">System guardrails stay active</text>
    <text x="604" y="472" fill="#4B527C" font-size="15">Permissions　Budget　Monitoring</text>
    <text x="604" y="514" fill="#4B527C" font-size="15">Circuit breaker　Audit　Recovery</text>
    <g data-multiline="true"><text x="604" y="544" fill="#292A5A" font-size="17" font-weight="600">Accountability and</text><text x="604" y="566" fill="#292A5A" font-size="17" font-weight="600">incident response</text></g>
  </g>
  <line x1="64" y1="670" x2="1016" y2="670" stroke="#7E8FD5" stroke-width="3" stroke-linecap="round"/>
  <text x="64" y="729" fill="#292A5A" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Agent commits to responsibility within boundaries</text>
  <g aria-label="Original Yunzhou mascot host">
    <circle cx="935" cy="715" r="92" fill="#FFF8EC" stroke="#292A5A" stroke-width="3"/>
    <image href="mascot-yunzhou-avatar-v4.png" x="846" y="626" width="178" height="178" preserveAspectRatio="xMidYMid slice" clip-path="url(#mascotBubble)"/>
  </g>
  <rect width="1080" height="820" fill="url(#paper)" pointer-events="none"/>
</svg>
