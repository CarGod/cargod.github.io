<svg lang="ja" data-locale="ja" xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880">
  <title>知識、ツール、ワークフロー、ガバナンスの四層から次の能力を判断する</title>
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#FFFFFF" opacity="0.20"/>
      <circle cx="20" cy="18" r="0.8" fill="#29305F" opacity="0.035"/>
    </pattern>
    <clipPath id="mascotBubble"><circle cx="935" cy="777" r="89"/></clipPath>
  </defs>
  <rect width="1080" height="880" fill="#EAF6FF"/>
  <g fill="#FFF8EC">
    <circle cx="908" cy="34" r="66"/><circle cx="974" cy="30" r="94"/><circle cx="1058" cy="66" r="70"/>
  </g>
  <g fill="#BDE9DC" opacity="0.78">
    <circle cx="960" cy="77" r="36"/><circle cx="1012" cy="80" r="45"/><circle cx="1070" cy="92" r="36"/>
  </g>
  <path d="M64 58 H118" stroke="#F47F70" stroke-width="7" stroke-linecap="round"/>
  <text x="64" y="116" fill="#292A5A" font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="38" font-weight="700">足りない層から先に整える</text>
  <text x="64" y="157" fill="#4B527C" font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="20">最初から「Agent をどう作るか」と問わない</text>
  <g font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, sans-serif">
    <line x1="64" y1="224" x2="1016" y2="224" stroke="#7E8FD5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="279" r="34" fill="#3E97E8" stroke="#292A5A" stroke-width="3"/>
    <text x="92" y="291" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">01</text>
    <text x="164" y="289" fill="#292A5A" font-size="27" font-weight="700">知識</text>
    <text x="370" y="289" fill="#4B527C" font-size="21">回答に根拠はあるか？ 分からないと認められるか？</text>
    <line x1="64" y1="348" x2="1016" y2="348" stroke="#7E8FD5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="403" r="34" fill="#FFDCC2" stroke="#292A5A" stroke-width="3"/>
    <text x="92" y="415" text-anchor="middle" fill="#292A5A" font-family="Arial, sans-serif" font-size="28" font-weight="700">02</text>
    <text x="164" y="413" fill="#292A5A" font-size="27" font-weight="700">ツール</text>
    <text x="370" y="413" fill="#4B527C" font-size="21">入口は明確で、安全かつ追跡可能か？</text>
    <line x1="64" y1="472" x2="1016" y2="472" stroke="#7E8FD5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="527" r="34" fill="#BDE9DC" stroke="#292A5A" stroke-width="3"/>
    <text x="92" y="539" text-anchor="middle" fill="#292A5A" font-family="Arial, sans-serif" font-size="28" font-weight="700">03</text>
    <text x="164" y="537" fill="#292A5A" font-size="27" font-weight="700">ワークフロー</text>
    <text x="370" y="537" fill="#4B527C" font-size="21">タスクを進め続け、変化後も再開できるか？</text>
    <line x1="64" y1="596" x2="1016" y2="596" stroke="#7E8FD5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="651" r="34" fill="#929FE5" stroke="#292A5A" stroke-width="3"/>
    <text x="92" y="663" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">04</text>
    <text x="164" y="661" fill="#292A5A" font-size="27" font-weight="700">ガバナンス</text>
    <text x="370" y="661" fill="#4B527C" font-size="21">境界内で問題が起きたら、誰が対応し責任を負うか？</text>
    <line x1="64" y1="720" x2="1016" y2="720" stroke="#7E8FD5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="64" y="794" fill="#292A5A" font-family="Hiragino Sans, Yu Gothic, Noto Sans CJK JP, sans-serif" font-size="24" font-weight="600">最も弱い層を見つけ、そこから始める</text>
  <g aria-label="オリジナルキャラクター雲舟">
    <circle cx="935" cy="777" r="92" fill="#FFDCC2" stroke="#292A5A" stroke-width="3"/>
    <image href="mascot-yunzhou-avatar-v4.png" x="846" y="688" width="178" height="178" preserveAspectRatio="xMidYMid slice" clip-path="url(#mascotBubble)"/>
  </g>
  <rect width="1080" height="880" fill="url(#paper)" pointer-events="none"/>
</svg>
